services:
  mysql:
    image: mysql:8.4
    container_name: phrolova-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-phrolova_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-phrolova_game}
      MYSQL_USER: ${MYSQL_USER:-phrolova}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-phrolova_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 15

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: phrolova-server
    restart: unless-stopped
    environment:
      PHROLOVA_DB_HOST: mysql
      PHROLOVA_DB_PORT: 3306
      PHROLOVA_DB_NAME: ${MYSQL_DATABASE:-phrolova_game}
      PHROLOVA_DB_USER: ${MYSQL_USER:-phrolova}
      PHROLOVA_DB_PASSWORD: ${MYSQL_PASSWORD:-phrolova_pass}
      PHROLOVA_DB_CHARSET: utf8mb4
      PHROLOVA_SECRET_KEY: ${SERVER_SECRET_KEY:-replace-me}
      PHROLOVA_SERVER_PORT: ${SERVER_PORT:-5000}
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: phrolova-client
    restart: unless-stopped
    environment:
      VITE_API_BASE: /api
      VITE_SOCKET_PATH: /socket.io
    depends_on:
      - server

  openresty:
    build:
      context: .
      dockerfile: infra/openresty/Dockerfile
    container_name: phrolova-openresty
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - client
      - server

volumes:
  mysql_data:
