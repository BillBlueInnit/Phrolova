worker_processes  1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  upstream phrolova_client {
    server client:4173;
  }

  upstream phrolova_server {
    server server:5000;
  }

      map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Plain HTTP — always available, no certificate required.
  server {
    listen 80;
    server_name _;

    include /usr/local/openresty/nginx/conf/locations.conf;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS certificates. Mount a "certs" directory into the container so that
    # /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem exist,
    # e.g.:
    #   volumes:
    #     - /path/to/certs:/etc/nginx/certs:ro
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /usr/local/openresty/nginx/conf/locations.conf;
  }
}

