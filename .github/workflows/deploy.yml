name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置以下 Secrets：
#   CLOUDFLARE_API_TOKEN  — Cloudflare API Token（需具备 Workers/Pages/D1/KV 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID
#   D1_DATABASE_ID        — D1 数据库 ID
#   KV_NAMESPACE_ID       — KV 命名空间 ID

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.jsonc files
        run: |
          sed \
            -e "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${{ secrets.D1_DATABASE_ID }}|g" \
            -e "s|REPLACE_WITH_YOUR_KV_NAMESPACE_ID|${{ secrets.KV_NAMESPACE_ID }}|g" \
            -e "s|REPLACE_WITH_YOUR_KV_PREVIEW_ID|${{ secrets.KV_NAMESPACE_ID }}|g" \
            wrangler.jsonc.example > wrangler.jsonc

          sed \
            -e "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${{ secrets.D1_DATABASE_ID }}|g" \
            -e "s|REPLACE_WITH_YOUR_KV_NAMESPACE_ID|${{ secrets.KV_NAMESPACE_ID }}|g" \
            cf-server/wrangler.jsonc.example > cf-server/wrangler.jsonc

      - name: Build frontend
        run: pnpm build

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm d1:migrate:remote

      - name: Deploy Workers (cf-server)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf-server
          command: deploy

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --branch production
